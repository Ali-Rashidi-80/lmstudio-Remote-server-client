[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# B008: FastAPI Depends/File(...) defaults are idiomatic
# E203: conflicts with black slice formatting
ignore = ["E501", "B008", "E203"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100
src_paths = ["app", "tests"]
known_first_party = ["app"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
pretty = true
exclude = ["alembic/"]

[tool.pylint.main]
py-version = "3.11"
ignore = ["alembic", ".venv"]
extension-pkg-allow-list = ["pydantic"]

[tool.pylint.format]
max-line-length = 100

[tool.pylint.basic]
good-names = ["SessionLocal", "_redis", "admin", "user", "pending", "id", "db", "ws", "ok", "ip", "v", "q"]

[tool.pylint."messages control"]
disable = [
  "missing-module-docstring",
  "missing-class-docstring",
  "missing-function-docstring",
  "too-few-public-methods",
  "too-many-arguments",
  "too-many-positional-arguments",
  "too-many-locals",
  "too-many-branches",
  "too-many-statements",
  "too-many-instance-attributes",
  "too-many-return-statements",
  "import-outside-toplevel",
  "global-statement",
  "broad-exception-caught",
  "duplicate-code",
  "not-callable",
  "unnecessary-pass",
  "line-too-long",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
