name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: aiws
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: aiworkspace
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aiws -d aiworkspace"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://aiws:testpass@localhost:5432/aiworkspace
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-test-secret-not-for-production-32bytes
      WORKER_TOKEN: ci-worker-token-min-16
      ADMIN_BOOTSTRAP_USERNAME: admin
      ADMIN_BOOTSTRAP_PASSWORD: adminpass12
      CORS_ORIGINS: http://localhost:3000,http://localhost:3010
      COOKIE_SECURE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -r backend/requirements.txt pylint
      - name: Ruff
        run: |
          cd backend && ruff check app tests ../pc_client/main.py ../pc_client/cipher_utils.py ../cipher_utils.py
      - name: Black / isort / flake8 / mypy / pylint / compileall
        run: |
          cd backend
          black --check app tests
          isort --check-only app tests
          flake8 app tests --max-line-length=100 --extend-ignore=E501,E203,E402
          mypy app --ignore-missing-imports
          pylint app
          python -m compileall -q app tests ../pc_client
      - name: Pytest
        run: |
          cd backend && PYTHONPATH=. pytest -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: |
          cd web && npm ci --registry=https://registry.npmjs.org/
      - name: TypeScript / ESLint / Build
        run: |
          cd web
          npx tsc --noEmit
          npm run lint
          npm run build

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
