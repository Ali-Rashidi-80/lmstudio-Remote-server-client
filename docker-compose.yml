services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: aiws
      POSTGRES_PASSWORD: change-me-db-password
      POSTGRES_DB: aiworkspace
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiws -d aiworkspace"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: mirror2.chabokan.net/redis:7-alpine
    ports:
      - "26379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  bridge:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://aiws:change-me-db-password@postgres:5432/aiworkspace
      REDIS_URL: redis://redis:6379/0
      HOST: 0.0.0.0
      PORT: 8000
      RAG_INGEST_MODE: arq
      CORS_ORIGINS: http://localhost:3000
    # Host 8010 avoids clash with other local services on :8000
    ports:
      - "${BRIDGE_HOST_PORT:-8010}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads:/app/storage
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  rag-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["arq", "app.workers.rag.WorkerSettings"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://aiws:change-me-db-password@postgres:5432/aiworkspace
      REDIS_URL: redis://redis:6379/0
      RAG_INGEST_MODE: arq
      # Inside compose, LM Studio on the host (local lab). Empty = embed via PC Worker WS.
      EMBED_DIRECT_URL: ${EMBED_DIRECT_URL:-http://host.docker.internal:1234}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      bridge:
        condition: service_healthy
    volumes:
      - uploads:/app/storage
    extra_hosts:
      - "host.docker.internal:host-gateway"

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:${BRIDGE_HOST_PORT:-8010}
    ports:
      - "3000:3000"
    depends_on:
      bridge:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
