services:
  postgres:
    image: ${POSTGRES_IMAGE:-pgvector/pgvector:pg16}
    environment:
      POSTGRES_USER: aiws
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-db-password}
      POSTGRES_DB: aiworkspace
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiws -d aiworkspace"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    # Set REDIS_IMAGE=mirror2.chabokan.net/redis:7-alpine on direct Iran hosts without proxy
    image: ${REDIS_IMAGE:-redis:7-alpine}
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-26379}:6379"
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  bridge:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://aiws:${POSTGRES_PASSWORD:-change-me-db-password}@postgres:5432/aiworkspace
      REDIS_URL: redis://redis:6379/0
      HOST: 0.0.0.0
      PORT: 8000
      RAG_INGEST_MODE: arq
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:3010}
    ports:
      - "127.0.0.1:${BRIDGE_HOST_PORT:-8010}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads:/app/storage
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10

  rag-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["arq", "app.workers.rag.WorkerSettings"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://aiws:${POSTGRES_PASSWORD:-change-me-db-password}@postgres:5432/aiworkspace
      REDIS_URL: redis://redis:6379/0
      BRIDGE_INTERNAL_URL: http://bridge:8000
      RAG_INGEST_MODE: arq
      EMBED_DIRECT_URL: ${EMBED_DIRECT_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      bridge:
        condition: service_healthy
    volumes:
      - uploads:/app/storage
    extra_hosts:
      - "host.docker.internal:host-gateway"
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import asyncio; from app.db.redis import redis_ping; raise SystemExit(0 if asyncio.run(redis_ping()) else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:${BRIDGE_HOST_PORT:-8010}
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-3010}:3000"
    depends_on:
      bridge:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  uploads:
