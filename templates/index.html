
<!DOCTYPE html>

<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>AI Mobile Bridge</title>

    <!-- استفاده از CDN برای Crypto-JS -->

    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>


    <style>

        :root { --primary: #007aff; --bg: #f4f4f9; }

        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto; background: var(--bg); margin: 0; display: flex; flex-direction: column; height: 100vh; }

        #chat-window { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }

        .msg { padding: 12px 16px; border-radius: 18px; max-width: 80%; word-wrap: break-word; font-size: 16px; }

        .user { align-self: flex-end; background: var(--primary); color: white; }

        .ai { align-self: flex-start; background: #e5e5ea; color: black; }

        #input-area { padding: 15px; background: white; border-top: 1px solid #ddd; display: flex; gap: 10px; }

        input { flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 20px; outline: none; }

        button { padding: 10px 20px; background: var(--primary); color: white; border: none; border-radius: 20px; cursor: pointer; }

    </style>

</head>

<body>



<div id="chat-window"></div>

<div id="input-area">

    <input type="text" id="msgInput" placeholder="پیام خود را بنویسید...">

    <button onclick="sendMessage()">ارسال</button>

</div>




<script>

    const KEY = CryptoJS.enc.Utf8.parse("12345678901234567890123456789012");

    

    // استفاده از ws:// به جای wss:// برای رفع خطای اتصال روی پورت 8000

    // اگر از دامنه استفاده می‌کنید، سعی کنید پورت را حذف کنید یا اگر روی هاست شخصی است، آدرس دقیق را بنویسید

    const wsUrl = "wss://lmstudio.chbk.dev/ws/mobile";

    const ws = new WebSocket(wsUrl);



    ws.onopen = () => console.log("اتصال با موفقیت برقرار شد!");

    ws.onerror = (err) => console.error("خطای اتصال وب‌ساکت:", err);

    

    ws.onmessage = (event) => {

        try {

            const data = JSON.parse(event.data);

            if (data.payload) {

                const decrypted = CryptoJS.AES.decrypt(data.payload, KEY, {

                    mode: CryptoJS.mode.ECB,

                    padding: CryptoJS.pad.Pkcs7

                }).toString(CryptoJS.enc.Utf8);

                renderMessage(decrypted, 'ai');

            }

        } catch (e) {

            console.error("خطا در پردازش پیام:", e);

        }

    };




    function renderMessage(text, type) {

        const div = document.createElement('div');

        div.className = `msg ${type}`;

        div.textContent = text;

        const container = document.getElementById('chat-window'); // اصلاح ID از 'chat' به 'chat-window'

        if (container) {

            container.appendChild(div);

            container.scrollTop = container.scrollHeight;

        }

    }





    function sendMessage() {

        const input = document.getElementById('msgInput');

        if (!input.value || ws.readyState !== WebSocket.OPEN) return;



        const encrypted = CryptoJS.AES.encrypt(input.value, KEY, {

            mode: CryptoJS.mode.ECB,

            padding: CryptoJS.pad.Pkcs7

        }).toString();



        ws.send(JSON.stringify({ payload: encrypted }));

        renderMessage(input.value, 'user');

        input.value = '';

    }

</script>

</body>

</html>
